name: Devon BakaSU + SUSFS 2.3
# Manual builds with raw Image or original-Axion boot.img output. No device operations.
on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output file (boot.img uses the supplied Axion 2.8 base)'
        required: true
        type: choice
        default: kernel
        options:
          - kernel
          - boot.img
permissions:
  contents: read
concurrency:
  group: devon-susfs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out lineage-23.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: lineage-23.2
          fetch-depth: 0
          persist-credentials: false
      - name: Free runner space and install build dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3 python3-yaml clang lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu rsync dwarves zstd
          df -h .
      - name: Fetch original boot base
        if: inputs.output_format == 'boot.img'
        run: python3 -B scripts/ci/fetch_boot_base.py
      - name: Check output packaging
        run: python3 -B scripts/ci/test_package_output.py
      - name: Verify pinned Android Clang
        run: |
          python3 -B scripts/ci/test_toolchain_integrity.py
          python3 -B scripts/ci/install_toolchain.py
      - name: Prepare pinned host test references
        run: python3 -B scripts/susfs/prepare_test_references.py
      - name: Check feature contracts and native ABI
        run: python3 -B scripts/susfs/run_host_checks.py
      - name: Build Image, device trees and modules
        env:
          JOBS: '4'
        run: bash ./build-susfs-test.sh --build --profile all --jobs 4
      - name: Validate configuration and native compatibility refusals
        run: |
          result=$(find artifacts/susfs-features-test -mindepth 2 -maxdepth 2 -name result.json -print -quit)
          python3 -B scripts/susfs/test_build_preparation.py "$(dirname "$result")" --profile all
      - name: Prepare selected output
        env:
          OUTPUT_FORMAT: ${{ inputs.output_format }}
        run: python3 -B scripts/ci/package_output.py --variant susfs --format "$OUTPUT_FORMAT" --base .backport-context/build/axion-boot-base/boot.img
      - name: Upload selected image and SHA256 only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devon-susfs-${{ inputs.output_format }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
